# PROJECT.toml — 專案 manifest(機器可讀,`proj` 指令據此做跨專案彙總)。
# user-owned:kit 永不覆蓋。狀態/指令/付費服務改變時同步本檔,並更新 updated。

name = "life-tracker"
status = "done"            # active | mvp | done | paused | abandoned
status_note = "遊戲相簿截圖排序改用上傳序號 seq，已 review 完成待部署;部署後跑 Migration B 將 seq 設為 NOT NULL"
updated = 2026-08-31       # 最後一次人工確認本檔內容的日期

[commands]                 # 只收「用它」的指令;開發指令見 package.json
crawl = "node scripts/crawl-to-file.mjs"   # 手動跑巴哈日報爬蟲(平時由 GitHub Actions 每日自動跑)

[[paid]]
service = "Google Cloud Storage"
billing = "按用量"
monthly_est = "?"          # 待確認：兩個 bucket(thumbnail/gallery)流量與儲存量未知
cancel = "刪除 GCS bucket + 撤銷 service account 金鑰(documents/setup_gcp.md 有建立步驟);移除 .env 的 GCP_* 變數"

[[paid]]
service = "Supabase"
billing = "free-tier"      # user 2026-07-11 確認未付費
monthly_est = "$0"
cancel = "Supabase dashboard 刪除專案；移除 .env 的 NEXT_PUBLIC_SUPABASE_* 變數"

[[paid]]
service = "Vercel"
billing = "free-tier"      # Hobby 方案，user 2026-07-11 確認；部署方式：Vercel Git 整合（repo 內無設定檔，push 自動部署）
monthly_est = "$0"
cancel = "Vercel dashboard 刪除專案或移除 GitHub 整合"
