name: Daily Crawler

on:
    schedule:
        # 每天 UTC 22:00 (台灣時間早上 06:00) 執行
        - cron: '0 10,22 * * *'
    # 允許手動在 GitHub 網頁上觸發
    workflow_dispatch:

permissions:
    contents: write

jobs:
    crawl-and-commit:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # pnpm/action-setup reads the pnpm version from package.json's
            # "packageManager" field; runs before setup-node so cache: pnpm works.
            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  # pnpm@11.5.0 (packageManager) imports node:sqlite → 需 Node ≥22.13,
                  # 釘 20 會炸 ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Crawler Script
              run: node scripts/crawl-to-file.mjs

            - name: Commit and Push changes
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: '🤖 Daily crawl update [skip ci]'
                  file_pattern: 'public/daily-news.json'
