<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 716" role="img" aria-labelledby="lifetracker-title lifetracker-desc" font-family="'JetBrains Mono',monospace">
  <title id="lifetracker-title">Life Tracker system overview</title>
  <desc id="lifetracker-desc">A mobile PWA reads and writes records in Supabase and sends images through a media API to GCS buckets; a scheduled crawler commits a static news digest from the Bahamut forum, and the public cholate.dev site reads portfolio data from the same Supabase.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="icon-browser" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <line x1="2" y1="9" x2="22" y2="9"/>
      <circle cx="5.5" cy="6.5" r="0.5"/>
      <circle cx="8" cy="6.5" r="0.5"/>
    </symbol>
    <symbol id="icon-bucket" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h16l-2 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L4 6z"/>
      <ellipse cx="12" cy="6" rx="8" ry="2.2"/>
    </symbol>
    <symbol id="icon-cloud" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 18a4.5 4.5 0 1 1 .8-8.9A6 6 0 0 1 19.5 11 3.75 3.75 0 0 1 18 18H7z"/>
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="6" rx="8" ry="3"/>
      <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
      <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2h8l4 4v16H6V2z"/>
      <path d="M14 2v4h4"/>
      <line x1="9" y1="12" x2="15" y2="12"/>
      <line x1="9" y1="16" x2="15" y2="16"/>
    </symbol>
    <symbol id="icon-gear" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>
    </symbol>
    <symbol id="icon-server" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="7" rx="2"/>
      <rect x="3" y="13" width="18" height="7" rx="2"/>
      <circle cx="7" cy="7.5" r="0.6"/>
      <circle cx="7" cy="16.5" r="0.6"/>
    </symbol>
  </defs>

  <rect width="1200" height="716" fill="#faf8f4"/>

  <text x="600" y="84" font-size="28" letter-spacing="6" text-anchor="middle" fill="#1a1a1a">LIFE TRACKER · SYSTEM OVERVIEW</text>

  <g class="zone" id="zone-clients" fill="none" stroke="#1a1a1a">
    <rect x="100" y="120" width="480" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="124" y="148" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">CLIENTS</text>
    <line x1="124" y1="156" x2="172" y2="156" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-offline" fill="none" stroke="#1a1a1a">
    <rect x="620" y="120" width="480" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="644" y="148" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">OFFLINE PIPELINE</text>
    <line x1="644" y1="156" x2="692" y2="156" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-server" fill="none" stroke="#1a1a1a">
    <rect x="580" y="312" width="520" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="604" y="340" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">SERVER</text>
    <line x1="604" y1="348" x2="652" y2="348" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-data" fill="none" stroke="#1a1a1a">
    <rect x="340" y="504" width="480" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="364" y="532" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">DATA</text>
    <line x1="364" y1="540" x2="412" y2="540" stroke-width="1"/>
  </g>

  <g fill="none" stroke="#1a1a1a" stroke-width="1.5">
    <path class="edge" id="e-pwa-db" d="M460,248 V562" marker-end="url(#ah)"/>
    <path class="edge" id="e-pwa-media" d="M508,248 V300 H740 V370" marker-end="url(#ah)"/>
    <path class="edge" id="e-pwa-news" d="M532,248 V280 H940 V370" marker-end="url(#ah)"/>
    <path class="edge" id="e-media-gcs" d="M700,440 V562" marker-end="url(#ah)"/>
    <path class="edge" id="e-media-db" d="M604,408 H520 V562" marker-end="url(#ah)"/>
    <path class="edge" id="e-bahamut-crawler" d="M836,216 H878" marker-end="url(#ah)"/>
    <path class="edge" id="e-crawler-news" d="M980,248 V370" marker-end="url(#ah)"/>
    <path class="edge" id="e-site-db" d="M220,248 V600 H358" marker-end="url(#ah)"/>
  </g>

  <g class="node" id="n-site">
    <rect x="124" y="184" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-cloud" x="140" y="204" width="24" height="24"/>
    <text x="180" y="212" font-size="14" font-weight="600" fill="#1a1a1a">cholate.dev</text>
    <text x="180" y="230" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Public portfolio</text>
  </g>
  <g class="node" id="n-pwa">
    <rect x="364" y="184" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-browser" x="380" y="204" width="24" height="24"/>
    <text x="420" y="212" font-size="14" font-weight="600" fill="#1a1a1a">Mobile PWA</text>
    <text x="420" y="230" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Records, img prep</text>
  </g>
  <g class="node" id="n-bahamut">
    <rect x="644" y="184" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-cloud" x="660" y="204" width="24" height="24"/>
    <text x="700" y="212" font-size="14" font-weight="600" fill="#1a1a1a">Bahamut Forum</text>
    <text x="700" y="230" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Board source</text>
  </g>
  <g class="node" id="n-crawler">
    <rect x="884" y="184" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-gear" x="900" y="204" width="24" height="24"/>
    <text x="940" y="212" font-size="14" font-weight="600" fill="#1a1a1a">Daily Crawler</text>
    <text x="940" y="230" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Scheduled scrape</text>
  </g>
  <g class="node" id="n-media">
    <rect x="604" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-server" x="620" y="396" width="24" height="24"/>
    <text x="660" y="404" font-size="14" font-weight="600" fill="#1a1a1a">Media API</text>
    <text x="660" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Resize, hash, store</text>
  </g>
  <g class="node" id="n-news">
    <rect x="884" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-file" x="900" y="396" width="24" height="24"/>
    <text x="940" y="404" font-size="14" font-weight="600" fill="#1a1a1a">News JSON</text>
    <text x="940" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Static daily digest</text>
  </g>
  <g class="node" id="n-db">
    <rect x="364" y="568" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-database" x="380" y="588" width="24" height="24"/>
    <text x="420" y="596" font-size="14" font-weight="600" fill="#1a1a1a">Supabase</text>
    <text x="420" y="614" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Postgres + Auth</text>
  </g>
  <g class="node" id="n-gcs">
    <rect x="604" y="568" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-bucket" x="620" y="588" width="24" height="24"/>
    <text x="660" y="596" font-size="14" font-weight="600" fill="#1a1a1a">GCS Buckets</text>
    <text x="660" y="614" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Thumbnail, gallery</text>
  </g>

  <g class="label" id="l-image-token" data-edge="e-pwa-media">
    <rect x="746" y="324" width="98" height="14" fill="#faf8f4"/>
    <text x="750" y="334" font-size="10" letter-spacing="1" fill="#1a1a1a">IMAGE + TOKEN</text>
  </g>
  <g class="label" id="l-repo-commit" data-edge="e-crawler-news">
    <rect x="986" y="292" width="84" height="14" fill="#faf8f4"/>
    <text x="990" y="302" font-size="10" letter-spacing="1" fill="#1a1a1a">REPO COMMIT</text>
  </g>
  <g class="label" id="l-portfolio-data" data-edge="e-site-db">
    <rect x="226" y="400" width="105" height="14" fill="#faf8f4"/>
    <text x="230" y="410" font-size="10" letter-spacing="1" fill="#1a1a1a">PORTFOLIO DATA</text>
  </g>
</svg>
